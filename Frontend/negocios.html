<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio Turístico | Destino de Ensueño</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1 class="logo"><a href="index.html">🌟 Destino de Ensueño</a></h1>
            <nav><ul id="nav-links"></ul></nav>
        </div>
    </header>

    <main class="container section">
        <h2 class="section-title">Directorio Turístico</h2>

        <div class="filters-bar">
            <input type="text" id="searchInput" placeholder="Buscar por nombre o descripción...">
            <select id="categoryFilter">
                <option value="">Todas las categorías</option>
            </select>
            <button onclick="loadBusinesses()">🔍 Buscar</button>
            <button onclick="clearFilters()" class="btn-secondary">✖ Limpiar</button>
        </div>

        <div id="results-info" style="margin-bottom: 10px; color: #666;"></div>
        <div class="card-grid" id="business-list">
            <p>Cargando negocios...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Destino de Ensueños</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('search')) {
            document.getElementById('searchInput').value = urlParams.get('search');
        }

        async function loadCategories() {
            try {
                const categories = await ApiService.request('/Category');
                const select = document.getElementById('categoryFilter');
                categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name;
                    select.appendChild(opt);
                });
                if (urlParams.get('categoryId')) {
                    select.value = urlParams.get('categoryId');
                }
            } catch (err) {
                console.warn('No se pudieron cargar las categorías:', err.message);
            }
        }

        async function loadBusinesses() {
            const list = document.getElementById('business-list');
            const info = document.getElementById('results-info');
            const search = document.getElementById('searchInput').value.trim();
            const categoryId = document.getElementById('categoryFilter').value;

            list.innerHTML = '<p>Cargando...</p>';
            info.textContent = '';

            let endpoint = '/Business';
            const params = [];
            if (search) params.push(`search=${encodeURIComponent(search)}`);
            if (categoryId) params.push(`categoryId=${categoryId}`);
            if (params.length) endpoint += '?' + params.join('&');

            try {
                const data = await ApiService.request(endpoint);
                info.textContent = `${data.length} resultado(s) encontrado(s)`;

                if (data.length === 0) {
                    list.innerHTML = '<p style="text-align:center; padding: 40px;">No se encontraron negocios con esos criterios.</p>';
                    return;
                }

                list.innerHTML = data.map(b => `
                    <div class="card business-card" onclick="window.location.href='negocio.html?id=${b.id}'" style="cursor:pointer;">
                        <div class="card-category-badge">${b.categoryName}</div>
                        <h3>${b.name}</h3>
                        <p class="card-desc">${b.description}</p>
                        <p class="card-address">📍 ${b.address}</p>
                        <div class="card-rating">
                            ${renderStars(b.averageRating)}
                            <span>${b.averageRating.toFixed(1)} (${b.reviewCount} reseñas)</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = `<p class="error-msg">Error al cargar negocios: ${err.message}</p>`;
            }
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            loadBusinesses();
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadBusinesses();
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategories();
            await loadBusinesses();
        });
    </script>
</body>
</html>
