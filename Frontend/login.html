<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Destino de Ensueño</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar"><div class="container"><h1 class="logo"><a href="index.html">Destino de Ensueño</a></h1></div></header>

    <main class="container section center-form">
        <div class="card form-card">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <p id="error-msg" class="error-msg"></p>
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>
            <p class="text-center mt-3">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
