<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Destino de Ensueño</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar"><div class="container"><h1 class="logo"><a href="index.html">Destino de Ensueño</a></h1></div></header>

    <main class="container section center-form">
        <div class="card form-card">
            <h2>Crear Cuenta</h2>
            <form id="register-form">
                <div class="form-group"><label>Nombre</label><input type="text" id="firstName" required></div>
                <div class="form-group"><label>Apellido</label><input type="text" id="lastName" required></div>
                <div class="form-group"><label>Correo Electrónico</label><input type="email" id="email" required></div>
                <div class="form-group"><label>Contraseña</label><input type="password" id="password" required></div>
                <p id="error-msg" class="error-msg"></p>
                <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
            </form>
            <p class="text-center mt-3">¿Ya tienes cuenta? <a href="login.html">Ingresa aquí</a></p>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('register-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const dto = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            try {
                const res = await fetch('http://localhost:5058/api/Auth/register', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dto)
                });
                if(!res.ok) {
                    const data = await res.json().catch(()=>null);
                    throw new Error(data?.message || 'Error en el registro (revisa que la contraseña tenga mayúsculas, minúsculas, números y 6+ caracteres)');
                }
                alert('Registro exitoso. Ahora puedes iniciar sesión.');
                window.location.href = 'login.html';
            } catch (err) {
                document.getElementById('error-msg').textContent = err.message;
            }
        });
    </script>
</body>
</html>
